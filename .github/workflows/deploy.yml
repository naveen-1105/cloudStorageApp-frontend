name: Deploy Cloudosphere frontend

on: [push, workflow_dispatch]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      S3_BUCKET_NAME: cloudosphere-frontend
      CLOUDFRONT_DISTRIBUTION_ID: EZD4ART89QW8S
      VITE_GOOGLE_CLIENT_ID: 4555697613-18p3s2o6hl7mvc3gj0o2a2bg7b27tj9m.apps.googleusercontent.com
      VITE_BACKEND_BASE_URL: https://api.cloudosphere.live
    steps:
      - name: clone repository
        run: git clone https://github.com/naveen-1105/cloudStorageApp-frontend.git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" --recursive

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution "$CLOUDFRONT_DISTRIBUTION_ID"
            --paths "/index.html"

      - name: DeployMent Completed
        run: echo "Frontend Deployed Successfully..."